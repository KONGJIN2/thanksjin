<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html,body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: auto;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        body {
            background: #FFF;
            overflow-y: hidden;
        }
        .wrap {
            margin: 0;
            padding: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            height: auto;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .imgBox {
            min-height: 100%;
        }
    </style>
    <title>Dearie</title>
</head>
<body>
    <div class="wrap">
        <div class="imgBox">
            <img src="../img/dearie_uxui.png" alt="디어리">
        </div>
    </div>
</body>
</html>
