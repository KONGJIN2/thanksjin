<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UX/UI 프로젝트 아카이브 — 이글루, 디어리, 따릉이">
    <title>Projects — UX/UI Archive</title>
    <style>
        @import url("https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css");

        :root {
            --ink: #161616;
            --muted: #6f6f6f;
            --line: rgba(22, 22, 22, 0.13);
            --surface: #f3f1ec;
            --white: #fff;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-width: 320px;
            height: 100svh;
            overflow: hidden;
            color: var(--ink);
            background: var(--surface);
            font-family: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
            -webkit-font-smoothing: antialiased;
            background: #000 !important;
            color: #fff !important;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        .page {
            width: min(1440px, 100%);
            height: 100svh;
            margin: 0 auto;
            padding: 28px clamp(20px, 4vw, 64px) 44px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--line);
        }

        .brand {
            font-size: 0.82rem;
            font-weight: 700;
            letter-spacing: 0.16em;
            text-transform: uppercase;
        }

        .count {
            color: var(--muted);
            font-size: 0.8rem;
        }

        .intro {
            display: grid;
            grid-template-columns: 1fr auto;
            align-items: end;
            gap: 32px;
            padding: clamp(28px, 5vh, 64px) 0 clamp(24px, 4vh, 48px);
        }

        h1 {
            max-width: 920px;
            margin: 0;
            font-size: clamp(2.8rem, 8vw, 7.5rem);
            font-weight: 500;
            line-height: 0.91;
            letter-spacing: -0.075em;
        }

        .intro p {
            width: 16rem;
            margin: 0 0 0.45rem;
            color: var(--muted);
            font-size: 0.9rem;
            line-height: 1.65;
            word-break: keep-all;
        }

        .projects {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: clamp(14px, 2vw, 28px);
            min-height: 0;
            flex: 1;
        }

        .project {
            display: block;
            min-width: 0;
            min-height: 0;
        }

        .thumb {
            position: relative;
            display: block;
            height: calc(100% - 92px);
            min-height: 0;
            overflow: hidden;
            border-radius: 2px;
            background: #ddd;
        }

        .thumb::after {
            content: "기획서 보기  ↗";
            position: absolute;
            right: 14px;
            bottom: 14px;
            padding: 10px 13px;
            color: #fff;
            background: rgba(0, 0, 0, 0.72);
            border-radius: 999px;
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 180ms ease, transform 180ms ease;
        }

        .thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
            transition: transform 500ms cubic-bezier(.2,.7,.2,1);
        }

        .project:hover .thumb img,
        .thumb:focus-visible img {
            transform: scale(1.025);
        }

        .project:hover .thumb::after,
        .thumb:focus-visible::after {
            opacity: 1;
            transform: translateY(0);
        }

        .thumb:focus-visible {
            outline: 2px solid var(--ink);
            outline-offset: 5px;
        }

        .meta {
            display: grid;
            grid-template-columns: 2rem 1fr auto;
            align-items: baseline;
            gap: 10px;
            padding-top: 16px;
        }

        .number,
        .type {
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
        }

        .title {
            margin: 0;
            font-size: clamp(1.15rem, 2vw, 1.55rem);
            font-weight: 600;
            letter-spacing: -0.035em;
        }

        .project-links {
            display: flex;
            grid-column: 2 / -1;
            gap: 7px;
            margin-top: 1px;
        }

        .project-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 30px;
            padding: 0 12px;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 600;
            transition: color 180ms ease, background 180ms ease, border-color 180ms ease;
        }

        .project-link:hover,
        .project-link:focus-visible {
            color: #fff;
            background: var(--ink);
            border-color: var(--ink);
            outline: none;
        }

        .project-link.is-disabled {
            color: #aaa;
            cursor: default;
        }

        @media (max-width: 900px) {
            body {
                height: auto;
                overflow-y: auto;
            }

            .page {
                height: auto;
                min-height: 100svh;
                padding: 18px 16px 40px;
                overflow: visible;
            }

            .header {
                padding-bottom: 14px;
            }

            .intro {
                grid-template-columns: 1fr;
                gap: 16px;
                padding: 36px 0 30px;
            }

            h1 {
                font-size: clamp(3.15rem, 15vw, 5rem);
                line-height: 0.88;
            }

            .intro p {
                width: min(100%, 24rem);
                font-size: 0.88rem;
                line-height: 1.6;
            }

            .projects {
                grid-template-columns: 1fr;
                grid-template-rows: none;
                gap: 42px;
            }

            .project {
                display: block;
                overflow: visible;
                background: transparent;
            }

            .thumb {
                height: auto;
                aspect-ratio: 4 / 3;
                border-radius: 3px;
            }

            .meta {
                grid-template-columns: 2rem 1fr auto;
                align-items: baseline;
                padding: 14px 2px 0;
            }

            .project-links {
                grid-column: 2 / -1;
                flex-wrap: wrap;
                margin-top: 3px;
            }

            .type {
                grid-column: auto;
            }

            .title {
                font-size: 1.35rem;
            }

            .thumb::after {
                opacity: 1;
                transform: none;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            .thumb img, .thumb::after { transition: none; }
        }
    </style>
</head>
<body>
    <main class="page">
        <header class="header">
            <a class="brand" href="./" aria-label="프로젝트 홈">진홍진 포트폴리오</a>
            <span class="count">영크단 지원서 보기</span>
        </header>

        <section class="intro" aria-labelledby="page-title">
            <h1 id="page-title">Digital<br>Experiences.</h1>
            <p style="display: none;">내용 정해주소!</p>
        </section>

        <section class="projects" aria-label="프로젝트 목록">
            <article class="project">
                <a class="thumb" href="./igloo/index.html" aria-label="이글루 기획서 보기">
                    <img src="./img/igloo_uxui.png" alt="이글루 UX/UI 프로젝트 미리보기">
                </a>
                <div class="meta">
                    <span class="number">01</span>
                    <h2 class="title">이글루</h2>
                    <span class="type">UX/UI</span>
                    <div class="project-links">
                        <a class="project-link" href="./igloo/index.html">기획서</a>
                        <a class="project-link" href="https://kongjin2.github.io/igloo/" target="_blank" rel="noopener noreferrer">사이트 ↗</a>
                    </div>
                </div>
            </article>

            <article class="project">
                <a class="thumb" href="./dearie/index.html" aria-label="디어리 기획서 보기">
                    <img src="./img/dearie_uxui.png" alt="디어리 UX/UI 프로젝트 미리보기">
                </a>
                <div class="meta">
                    <span class="number">02</span>
                    <h2 class="title">디어리</h2>
                    <span class="type">UX/UI</span>
                    <div class="project-links">
                        <a class="project-link" href="./dearie/index.html">기획서</a>
                        <a class="project-link" href="https://dearie-app-v3.vercel.app/" target="_blank" rel="noopener noreferrer">사이트 ↗</a>
                    </div>
                </div>
            </article>

            <article class="project">
                <a class="thumb" href="./bike/index.html" aria-label="따릉이 기획서 보기">
                    <img src="./img/bike-UXUI.png" alt="따릉이 UX/UI 프로젝트 미리보기">
                </a>
                <div class="meta">
                    <span class="number">03</span>
                    <h2 class="title">따릉이</h2>
                    <span class="type">UX/UI</span>
                    <div class="project-links">
                        <a class="project-link" href="./bike/index.html">기획서</a>
                    </div>
                </div>
            </article>
        </section>
    </main>
</body>
</html>
